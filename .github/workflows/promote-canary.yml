name: Promote Canary
# Promeut la version qui tourne en CANARY vers la STABLE :
#   - copie l'image + version du canary sur le deploiement stable (rolling update)
#   - remet tout le trafic sur la stable (poids canary = 0)
# Declenche par le bot Discord (/promote) ou manuellement. Validation humaine requise.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production    # <-- pause + approbation humaine (on modifie la prod stable)
    steps:
      - uses: actions/checkout@v4

      - name: Installer Terraform
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform

      - name: Recuperer l'IP de la prod
        id: tf
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: pictionary-prod
        run: |
          terraform init
          echo "ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"

      - name: Preparer la cle SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Lire la version du canary
        id: canary
        run: |
          VER=$(ssh -o StrictHostKeyChecking=no debian@${{ steps.tf.outputs.ip }} \
            "sudo k3s kubectl get deploy pictionary-web -n pictionary-canary -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name==\"APP_VERSION\")].value}'")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version canary a promouvoir : $VER"

      - name: Promouvoir le canary en stable
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ steps.tf.outputs.ip }} 'bash -s' <<'REMOTE'
          set -e
          # Recupere l'image et la version exactes du canary
          CANARY_IMG=$(sudo k3s kubectl get deploy pictionary-web -n pictionary-canary -o jsonpath='{.spec.template.spec.containers[0].image}')
          CANARY_VER=$(sudo k3s kubectl get deploy pictionary-web -n pictionary-canary -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="APP_VERSION")].value}')
          echo "Promotion de $CANARY_VER ($CANARY_IMG) vers la stable"
          # Applique l'image + version du canary sur le deploiement stable (rolling update)
          sudo k3s kubectl set image deployment/pictionary-web web="$CANARY_IMG" -n pictionary
          sudo k3s kubectl set env deployment/pictionary-web APP_VERSION="$CANARY_VER" -n pictionary
          sudo k3s kubectl rollout status deployment/pictionary-web -n pictionary --timeout=180s
          # Remet tout le trafic sur la stable (poids canary = 0)
          sudo k3s kubectl patch traefikservices.traefik.io pictionary-weighted -n pictionary --type merge \
            -p '{"spec":{"weighted":{"services":[{"name":"pictionary-web-service","namespace":"pictionary","port":80,"weight":100},{"name":"pictionary-web-service","namespace":"pictionary-canary","port":80,"weight":0}]}}}'
          REMOTE

      - name: Nettoyer la cle SSH
        if: always()
        run: rm -f ~/.ssh/id_rsa

      - name: Notifier #deploiements (promotion effectuee)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Canary promu en production\",
                \"description\": \"La version canary est desormais la version stable. Tout le trafic est repasse sur la stable.\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"Nouvelle version stable\", \"value\": \"\`${{ steps.canary.outputs.version }}\`\", \"inline\": true},
                  {\"name\": \"Poids canary\", \"value\": \"0%\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"Pictionary - Promotion\"}
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_DEPLOIEMENTS }}"

      - name: Notifier #versions (nouvelle version stable)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Version en production\",
                \"description\": \"Suite a la promotion du canary, la production execute la version ci-dessous.\",
                \"color\": 3447003,
                \"fields\": [
                  {\"name\": \"Version actuelle\", \"value\": \"\`${{ steps.canary.outputs.version }}\`\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"Pictionary - Suivi de version\"}
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_VERSIONS }}"