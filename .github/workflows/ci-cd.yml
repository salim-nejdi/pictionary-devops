name: CI/CD Pictionary

# Un seul run, declenche par un push sur main, enchaine tout via "needs" :
# build -> deploy preprod -> smoke tests -> release -> deploy prod (validation humaine)
on:
  push:
    branches:
      - main
    paths:
      # Le pipeline ne se declenche QUE si le code applicatif ou l'infra change.
      # Une modif du bot Discord, des workflows ou de la doc ne declenche rien.
      - 'src/**'         # code de l'application
      - 'kubernetes/**'  # manifestes K8s
      - 'ansible/**'     # configuration / deploiement
      - 'terraform/**'   # infrastructure

permissions:
  contents: write    # semantic-release : creation tags/release/commit changelog
  packages: write    # push images sur GHCR

jobs:
  # ===========================================================================
  # 1. BUILD : construit l'image preprod (tag = SHA court) et la pousse sur GHCR
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir le tag d'image (SHA court)
        id: meta
        run: echo "tag=preprod-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image preprod
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}

  # ===========================================================================
  # 2. DEPLOY-PREPROD : Terraform (VM) + Ansible (K3s + app) en preproduction
  # ===========================================================================
  deploy-preprod:
    needs: build
    runs-on: ubuntu-latest
    environment: preprod
    outputs:
      vm_ip: ${{ steps.tf.outputs.ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer Terraform et Ansible
        run: |
          sudo apt-get update && sudo apt-get install -y ansible netcat-openbsd
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform

      - name: Terraform apply (VM preprod)
        id: tf
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: pictionary-preprod
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_TENANT_ID: ${{ secrets.OS_TENANT_ID }}
          OS_TENANT_NAME: ${{ secrets.OS_TENANT_NAME }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"

      - name: Preparer cle SSH et mot de passe Vault
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault-pass.txt

      - name: Attendre que le SSH soit pret
        run: |
          for i in $(seq 1 30); do
            if nc -z -w5 "${{ steps.tf.outputs.ip }}" 22; then echo "SSH pret"; exit 0; fi
            echo "Attente SSH $i/30..."; sleep 10
          done
          echo "SSH injoignable"; exit 1

      - name: Deploiement Ansible (K3s + app)
        working-directory: ./ansible
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
        run: |
          ansible-playbook -i "${{ steps.tf.outputs.ip }}," playbook.yml \
            --vault-password-file /tmp/vault-pass.txt \
            --extra-vars "image_ref=ghcr.io/${{ github.repository }}:${{ needs.build.outputs.sha_tag }} app_version=${{ needs.build.outputs.sha_tag }}"

      - name: Nettoyer les fichiers sensibles
        if: always()
        run: rm -f ~/.ssh/id_rsa /tmp/vault-pass.txt

  # ===========================================================================
  # 3. SMOKE-TESTS : verifie que la preprod repond correctement
  #    -> Notifie #ci-builds (vert si succes, rouge si echec)
  # ===========================================================================
  smoke-tests:
    needs: deploy-preprod
    runs-on: ubuntu-latest
    steps:
      - name: Tests sur la preprod
        run: |
          IP="${{ needs.deploy-preprod.outputs.vm_ip }}"
          echo "Tests sur https://$IP"
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -ks -o /dev/null -w "%{http_code}" "https://$IP/" || echo "000")
            echo "Tentative $i/30 : HTTP $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 10
          done
          [ "$OK" = "1" ] || { echo "App jamais prete"; exit 1; }
          echo "Test 1 OK : site joignable"

          PAGE=$(curl -ks "https://$IP/")
          echo "$PAGE" | grep -qi "pictionary" || { echo "Test 2 ECHEC"; echo "$PAGE" | head -c 500; exit 1; }
          echo "Test 2 OK : contenu present"

          API=$(curl -ks "https://$IP/?action=get_word")
          [ -n "$API" ] || { echo "Test 3 ECHEC : API vide"; exit 1; }
          echo "Test 3 OK : API + BDD fonctionnelles"

      - name: Notifier #ci-builds (smoke tests reussis)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Smoke tests reussis",
                "description": "La preproduction a passe les tests de validation (site + API + BDD).",
                "color": 3066993,
                "fields": [
                  {"name": "Environnement", "value": "preprod", "inline": true},
                  {"name": "Image testee", "value": "`${{ needs.build.outputs.sha_tag }}`", "inline": true}
                ],
                "footer": {"text": "Pictionary CI/CD"}
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_CI }}"

      - name: Notifier #ci-builds (smoke tests echoues)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Smoke tests echoues",
                "description": "La preproduction n a pas passe les tests. Le pipeline est interrompu.",
                "color": 15158332,
                "fields": [
                  {"name": "Environnement", "value": "preprod", "inline": true},
                  {"name": "Image testee", "value": "`${{ needs.build.outputs.sha_tag }}`", "inline": true},
                  {"name": "Details", "value": "[Voir le run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"}
                ],
                "footer": {"text": "Pictionary CI/CD"}
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_CI }}"

  # ===========================================================================
  # 4. RELEASE : semantic-release calcule la version, cree tag + release + changelog
  # ===========================================================================
  release:
    needs: [build, smoke-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
      published: ${{ steps.semantic.outputs.published }}
      sha_tag: ${{ needs.build.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Lancer semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Lire la version publiee
        id: semantic
        run: |
          if [ -f .VERSION ]; then
            echo "version=$(cat .VERSION)" >> "$GITHUB_OUTPUT"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Version publiee : $(cat .VERSION)"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle version (commits sans impact)"
          fi

  # ===========================================================================
  # 5. NOTIFY-PROD : notifie #deploiements qu'une validation prod est attendue
  # ===========================================================================
  notify-prod:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notifier #deploiements (validation requise)
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Validation requise pour la PRODUCTION",
                "description": "Une nouvelle version est prete a etre deployee en production et attend une approbation manuelle.",
                "color": 15105570,
                "fields": [
                  {"name": "Version", "value": "`${{ needs.release.outputs.version }}`", "inline": true},
                  {"name": "Action", "value": "[Approuver le deploiement](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"}
                ],
                "footer": {"text": "Pictionary CI/CD"}
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_DEPLOIEMENTS }}"

  # ===========================================================================
  # 6. DEPLOY-PROD : promotion image versionnee + deploie (PAUSE validation humaine)
  #    -> Notifie #deploiements (succes) + #versions (version en prod)
  # ===========================================================================
  deploy-prod:
    needs: [release, notify-prod]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: production    # <-- pause + approbation humaine requise
    steps:
      - uses: actions/checkout@v4

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promouvoir l'image preprod testee en image versionnee (sans recompiler)
        # Immuabilite : on ne rebuild PAS. On retague l'image EXACTE validee par les smoke-tests.
        env:
          REPO: ghcr.io/${{ github.repository }}
          SRC: ${{ needs.release.outputs.sha_tag }}        # tag preprod teste
          DST: ${{ needs.release.outputs.version }}          # nouveau tag SemVer
        run: |
          docker pull "$REPO:$SRC"
          docker tag "$REPO:$SRC" "$REPO:$DST"
          docker push "$REPO:$DST"
          echo "Image promue : $REPO:$SRC -> $REPO:$DST (identique, non recompilee)"

      - name: Installer Terraform et Ansible
        run: |
          sudo apt-get update && sudo apt-get install -y ansible netcat-openbsd
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform

      - name: Terraform apply (VM prod)
        id: tf
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_WORKSPACE: pictionary-prod
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_TENANT_ID: ${{ secrets.OS_TENANT_ID }}
          OS_TENANT_NAME: ${{ secrets.OS_TENANT_NAME }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "ip=$(terraform output -raw instance_ip)" >> "$GITHUB_OUTPUT"

      - name: Preparer cle SSH et mot de passe Vault
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault-pass.txt

      - name: Attendre que le SSH soit pret
        run: |
          for i in $(seq 1 30); do
            if nc -z -w5 "${{ steps.tf.outputs.ip }}" 22; then echo "SSH pret"; exit 0; fi
            echo "Attente SSH $i/30..."; sleep 10
          done
          echo "SSH injoignable"; exit 1

      - name: Deploiement Ansible en prod (image versionnee)
        working-directory: ./ansible
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
        run: |
          ansible-playbook -i "${{ steps.tf.outputs.ip }}," playbook.yml \
            --vault-password-file /tmp/vault-pass.txt \
            --extra-vars "image_ref=ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }} app_version=${{ needs.release.outputs.version }} enable_monitoring=true discord_webhook_url=${{ secrets.DISCORD_WEBHOOK_ALERTES }}"

      - name: Nettoyer les fichiers sensibles
        if: always()
        run: rm -f ~/.ssh/id_rsa /tmp/vault-pass.txt

      - name: Notifier #deploiements (succes)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Deploiement PRODUCTION reussi",
                "description": "La nouvelle version est desormais en production.",
                "color": 3066993,
                "fields": [
                  {"name": "Version", "value": "`${{ needs.release.outputs.version }}`", "inline": true},
                  {"name": "Environnement", "value": "production", "inline": true},
                  {"name": "Acces", "value": "http://${{ steps.tf.outputs.ip }}"}
                ],
                "footer": {"text": "Pictionary CI/CD"}
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_DEPLOIEMENTS }}"

      - name: Notifier #versions (version actuelle en prod)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Version en production",
                "description": "La production execute actuellement la version ci-dessous.",
                "color": 3447003,
                "fields": [
                  {"name": "Version actuelle", "value": "`${{ needs.release.outputs.version }}`", "inline": true},
                  {"name": "Mise a jour le", "value": "<t:0:R>", "inline": true}
                ],
                "footer": {"text": "Pictionary - Suivi de version"}
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK_VERSIONS }}"
