name: Destroy Infrastructure

# workflow_dispatch = declenchement MANUEL (bouton "Run workflow" sur GitHub,
# ou appel via l'API GitHub depuis le bot Discord).
# "inputs" = parametres demandes au lancement.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement a detruire"
        required: true
        type: choice
        options:
          - preprod
          - prod

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    # On protege la destruction de la PROD derriere une validation humaine
    # (le meme environnement "production" avec required reviewers).
    # La preprod, elle, se detruit sans validation.
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || 'preprod' }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Terraform
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform

      - name: Terraform destroy
        working-directory: ./terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          # Selectionne le workspace selon l'input (pictionary-preprod ou pictionary-prod)
          TF_WORKSPACE: pictionary-${{ github.event.inputs.environment }}
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_TENANT_ID: ${{ secrets.OS_TENANT_ID }}
          OS_TENANT_NAME: ${{ secrets.OS_TENANT_NAME }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
        run: |
          terraform init
          terraform destroy -auto-approve

      - name: Notifier Discord (infra detruite)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "**Infrastructure detruite** : environnement `${{ github.event.inputs.environment }}` supprime."}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
