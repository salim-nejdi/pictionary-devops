[defaults]
inventory = inventory.ini
remote_user = debian
# utilisateur par defaut des images Debian OVH
private_key_file = ~/.ssh/id_rsa
# ecrite par le workflow depuis les GitHub Secrets
# Desactive la verification d'empreinte SSH : VM jetable (empreinte changeante) + runner non-interactif
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
force_color = True

[ssh_connection]
pipelining = True
# moins de connexions SSH par tache = plus rapide
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
