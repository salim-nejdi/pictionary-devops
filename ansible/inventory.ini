# inventory.ini — Inventaire de test LOCAL uniquement.
# En CI/CD (option 3), le workflow passe l'IP dynamiquement via :
#   ansible-playbook -i "$(terraform output -raw instance_ip)," playbook.yml
# Ce fichier sert donc surtout a tester en local : remplace l'IP ci-dessous.

[k3s_node]
REMPLACER_PAR_IP_VM

[k3s_node:vars]
ansible_user=debian
ansible_ssh_private_key_file=~/.ssh/id_rsa
