# 04-ingress.yaml — Exposition HTTP + HTTPS (cert auto-signe Traefik).
# Pas de Middleware (CRD non garanti) : l'app repond en HTTP et HTTPS, sans redirection auto.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pictionary-web-ingress
  namespace: pictionary
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pictionary-web-service
                port:
                  number: 80
