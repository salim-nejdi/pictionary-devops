# 03-web.yaml — Application web PHP/Apache (Deployment + Service).
# App stateless : pas de PVC ni ConfigMap. Exposee par l'Ingress (fichier 04).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pictionary-web
  namespace: pictionary
  labels:
    app: pictionary-web
spec:
  replicas: 2                # 2 copies = haute dispo (possible car stateless)
  selector:
    matchLabels:
      app: pictionary-web
  strategy:
    type: RollingUpdate      # mise a jour progressive, sans coupure
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # zero pod indispo : nouveau pret avant suppression de l'ancien
  template:
    metadata:
      labels:
        app: pictionary-web
    spec:
      containers:
        - name: web
          # __IMAGE_TAG__ : placeholder remplace par la CI/CD (SHA en preprod, SemVer en prod).
          # Jamais "latest" : tag immuable = version connue + rollback fiable.
          image: ghcr.io/salim-nejdi/pictionary-devops:__IMAGE_TAG__
          ports:
            - containerPort: 80
          # DB_HOST = nom du Service MariaDB (DNS interne). Credentials via Secret.
          env:
            - name: DB_HOST
              value: pictionary-db-service
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pictionary-db-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pictionary-db-secret
                  key: MYSQL_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: pictionary-db-secret
                  key: MYSQL_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          # liveness : si l'app ne repond plus -> K8s redemarre le pod
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          # readiness : tant que KO -> pas de trafic envoye (sans redemarrage)
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Service web ClusterIP : adresse interne. L'exposition externe = Ingress (04).
apiVersion: v1
kind: Service
metadata:
  name: pictionary-web-service
  namespace: pictionary
spec:
  selector:
    app: pictionary-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
