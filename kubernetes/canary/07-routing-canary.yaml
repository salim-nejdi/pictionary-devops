# 07-routing-canary.yaml — Routage pondere (canary) via Traefik.
# Remplace l'Ingress standard (04-ingress.yaml) : seul le TraefikService "weighted"
# permet de repartir le trafic entre deux services selon des poids.
#
# Poids initial : stable=100, canary=0 -> 100% du trafic sur la stable
# (comportement identique a aujourd'hui). On ajustera via /canary plus tard.

# --- TraefikService pondere : repartit le trafic stable / canary ---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: pictionary-weighted
  namespace: pictionary
spec:
  weighted:
    services:
      - name: pictionary-web-service
        namespace: pictionary           # version STABLE
        port: 80
        weight: 100
      - name: pictionary-web-service
        namespace: pictionary-canary     # version CANARY (cross-namespace)
        port: 80
        weight: 0

---
# --- IngressRoute : point d'entree HTTP + HTTPS, route vers le TraefikService pondere ---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pictionary-route
  namespace: pictionary
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: pictionary-weighted
          kind: TraefikService
  tls: {}                                 # cert auto-signe par defaut de Traefik
